<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김동주의 자기소개 페이지</title>
    <link rel="stylesheet" href="introStyle.css">
</head>

<body>

    <!-- 트리거 존 -->
    <div id="trigger-zone">

        <div id="wrapper" tabindex="0">
            <div class="notice">🔍</div>
        </div>

        <div id="container">
            <!--  각각의 박스 전체를 클릭 가능한 링크로 래핑 -->

            <!-- 1. 사이트 소개문 링크 -->
            <div class="grid-slot" id="slot-header">
                <a href="javascript:;" class="info-box-link">
                    <div id="header" class="info-box center-box">Mr. Kim's Introduction Site</div>
                </a>
            </div>

            <!-- 2. 간략 소개 링크 -->
            <div class="grid-slot" id="slot-sidebar1">
                <a href="profile.html" class="info-box-link">
                    <div id="sidebar1" class="info-box center-box">Profile</div>
                </a>
            </div>

            <!-- 3. 내 스펙 링크 -->
            <div class="grid-slot" id="slot-contents">
                <a href="specs.html" class="info-box-link">
                    <div id="contents" class="info-box center-box">Specs</div>
                </a>
            </div>

            <!-- 4. 취미 흥미 링크 -->
            <div class="grid-slot" id="slot-sidebar2">
                <a href="interests.html" class="info-box-link">
                    <div id="sidebar2" class="info-box center-box">Interests</div>
                </a>
            </div>

            <!-- 5.  sns 링크 -->
            <div class="grid-slot" id="slot-sidebar3" onclick="fnAlert()">
                <a href="https://www.youtube.com/@%EB%9D%BC%ED%82%A4%EC%95%84-k3q;" target="_blank"
                    class="info-box-link">
                    <div id="sidebar3" class="info-box center-box">SNS</div>
                </a>
            </div>

            <!-- 6. FDC 링크 -->
            <div class="grid-slot" id="slot-footer" onclick="fnAlert()">
                <a href="../introduction/FDC.html" target="_blank" class="info-box-link">
                    <div id="footer" class="info-box center-box">~FDC~ Link</div>
                </a>
            </div>
        </div>


    </div>

</body>

</html>

<script>
    function fnAlert() {
        alert("사이트를 새로 여시겠습니까?");
    }

    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');

        const timeString = `${hours}:${minutes}:${seconds}`;
        const clockNode = document.getElementById('live-clock');
        if (clockNode) clockNode.textContent = timeString;
    }
    setInterval(updateClock, 1000);
    window.addEventListener('DOMContentLoaded', updateClock);

</script>
