
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김동주의 자기소개 페이지</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Malgun Gothic', sans-serif;
            background-color: black;
        }

        /* 글자 중앙 정렬 */
        .center-box {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* 시작 이미지 */
        #wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 20px auto;
            background-image: url("Sonato eye.png");
            background-size: 100px 100px;
            background-position: center;
            background-repeat: no-repeat;
            border: 2px dashed #e7e2f3;
            border-radius: 10%;
            cursor: pointer;
            transition: transform 0.3s ease,
                        box-shadow 0.3s ease,
                        border-color 0.3s ease;
            z-index: 10;
        }

        #wrapper:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(231, 226, 243, 0.3);
            border-color: #3b27bc;
        }

        .notice {
            font-size: 18px;
            text-align: right;
            margin-bottom: 10px;
        }

        /* 전체 자기소개 페이지 */
        #container {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);

            width: min(1540px, 95vw);
            padding: 30px;
            background-color: #000000;
            color: gold;

            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            grid-template-areas:
                ". header header header header header header header header header header ."
                "sidebar1 sidebar1 sidebar1 sidebar1 . contents contents contents contents contents contents ."
                ". . . . . contents contents contents contents contents contents ."
                ". sidebar2 sidebar2 sidebar2 sidebar2 contents contents contents contents contents contents ."
                ". . . sidebar3 sidebar3 sidebar3 sidebar3 . . . . ."
                ". footer footer footer footer footer footer footer footer footer footer .";

            grid-template-rows:
                180px
                220px
                150px
                180px
                320px
                200px;

            gap: 20px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.5s ease,
                        visibility 0.5s ease;
        }

        #wrapper:hover #container,
        #wrapper:focus-within #container {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* 공통 박스 */
        .info-box {
            padding: 30px;
            border: 2px solid black;
            min-width: 0;
            transition: all 0.4s ease;
        }

        /* 사이트 소개문: 가로로 길게 확장 */
        #header {
            grid-area: header;
            background-color: #3b27bc;
            color: gold;
            transition: all 0.4s cubic-bezier(
                0.175, 0.885, 0.32, 1.275
            );
        }

        #header:hover {
            background-color: #6356bc;
            border-radius: 35%;
            transform: scale(1.03);
            box-shadow: 0 10px 25px rgba(59, 39, 188, 0.5);
        }

        /* 첫 번째 자기소개 */
        #sidebar1 {
            grid-area: sidebar1;
            background-color: #9244af;
            color: #9244af;
        }

        #sidebar1:hover {
            background-color: #ab6dc2;
            color: black;
            border-radius: 10%;
            transform: translateY(-10px);
        }

        /* 내 스펙 */
        #contents {
            grid-area: contents;
            background-color: #619d7d;
            color: #619d7d;
        }

        #contents:hover {
            background-color: #a9dfc2;
            color: black;
            border-radius: 10%;
            transform: scale(1.03);
        }

        /* 두 번째 자기소개 */
        #sidebar2 {
            grid-area: sidebar2;
            background-color: #a92f55;
            color: #a92f55;
        }

        #sidebar2:hover {
            background-color: #ca6a88;
            color: black;
            border-radius: 30%;
            transform: translateY(-12px);
        }

        /* 세 번째 자기소개 */
        #sidebar3 {
            grid-area: sidebar3;
            background-color: #95834b;
            color: #95834b;
            transition: all 0.4s cubic-bezier(
                0.175, 0.885, 0.32, 1.275
            );
        }

        #sidebar3:hover {
            background-color: #efb401;
            color: black;
            border-radius: 50%;
            transform: scale(1.08);
        }

        /* 기타 링크 */
        #footer {
            grid-area: footer;
            background-color: rgba(0, 0, 0, 0);
            color: rgba(163, 73, 73, 0.156);
        }

        #footer:hover {
            background-color: #93aaaa;
            color: black;
            border-radius: 50%;
            transform: scale(1.05);
        }

        /* 태블릿 화면 */
        @media (max-width: 1024px) {
            #container {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-template-areas:
                    "header header"
                    "sidebar1 contents"
                    "sidebar2 contents"
                    "sidebar3 sidebar3"
                    "footer footer";
                grid-template-rows:
                    180px 250px 250px 300px 180px;
                gap: 15px;
                padding: 20px;
            }
        }

        /* 모바일 화면 */
        @media (max-width: 600px) {
            #container {
                width: 95vw;
                grid-template-columns: minmax(0, 1fr);
                grid-template-areas:
                    "header"
                    "sidebar1"
                    "contents"
                    "sidebar2"
                    "sidebar3"
                    "footer";
                grid-template-rows:
                    180px 250px 350px 250px 300px 180px;
                gap: 15px;
                padding: 15px;
            }

            .info-box {
                padding: 15px;
            }

            #header:hover,
            #sidebar3:hover,
            #footer:hover {
                border-radius: 20%;
            }
        }
    </style>
</head>

<body>
    <div id="wrapper" tabindex="0">
        <div class="notice">🔍</div>

        <div id="container">
            <div id="header" class="info-box center-box">
                사이트 소개문
            </div>

            <div id="sidebar1" class="info-box center-box">
                내 소개글
            </div>

            <div id="contents" class="info-box center-box">
                내 스펙
            </div>

            <div id="sidebar2" class="info-box center-box">
                내 소개글
            </div>

            <div id="sidebar3" class="info-box center-box">
                내 소개글
            </div>

            <div id="footer" class="info-box center-box">
                기타 링크
            </div>
        </div>
    </div>
</body>
</html>
